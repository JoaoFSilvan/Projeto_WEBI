{% extends 'base.html' %}

{% block title %}Avaliar produto{% endblock %}

{% block content %}

<h2>Avaliar produto</h2>

<form method="post">

    {% csrf_token %}

    <div class="campo-avaliacao">

        <label>Escolha uma nota:</label>

        <div class="rating">

            <input type="radio" name="nota" value="5" id="star5">
            <label for="star5" title="5 estrelas">★</label>

            <input type="radio" name="nota" value="4" id="star4">
            <label for="star4" title="4 estrelas">★</label>

            <input type="radio" name="nota" value="3" id="star3">
            <label for="star3" title="3 estrelas">★</label>

            <input type="radio" name="nota" value="2" id="star2">
            <label for="star2" title="2 estrelas">★</label>

            <input type="radio" name="nota" value="1" id="star1">
            <label for="star1" title="1 estrela">★</label>

        </div>

    </div>

    <div class="campo-comentario">

        <label for="id_comentario">
            Comentário:
        </label>

        {{ form.comentario }}

    </div>

    <button type="submit">
        Enviar avaliação
    </button>

</form>

{% endblock %}
