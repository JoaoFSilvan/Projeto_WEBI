{% extends 'base.html' %}

{% block title %}
Excluir produto
{% endblock %}

{% block content %}

<h2>Excluir produto</h2>

<p>
    Tem certeza que deseja excluir
    <strong>{{ produto.nome }}</strong>?
</p>

<form method="post">

    {% csrf_token %}

    <button type="submit">
        Sim, excluir
    </button>

</form>

<a href="{% url 'produto-detail' produto.pk %}">
    Cancelar
</a>

{% endblock %}
